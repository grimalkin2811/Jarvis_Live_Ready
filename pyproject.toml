[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Sélection volontairement raisonnable : erreurs de syntaxe/undefined (E9),
# pyflakes (F), et une partie de pycodestyle (E4/E7). On ignore les réglages
# cosmétiques (E501 ligne longue) et les règles bruyantes non essentielles.
extend-select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",   # longueur de ligne (cosmétique, nombreuses lignes existantes)
    "E741",   # nom de variable ambigu (l)
    "F541",   # f-string sans placeholder
]

[tool.ruff.lint.per-file-ignores]
# Les imports ré-exportés de UI/__init__ sont volontaires (API publique).
"UI/__init__.py" = ["F401"]
# Les tests réutilisent le chemin sys.path avant import.
"tests/*" = ["E402", "E741", "F401", "F841", "F541"]
