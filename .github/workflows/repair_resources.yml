name: Repair resource cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch SQLite context managers and stale preset expectations
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          def patch_connect(path: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              original = text
              if "from contextlib import contextmanager" not in text:
                  text = text.replace("import datetime as dt\n", "import datetime as dt\nfrom contextlib import contextmanager\n", 1)
              old = '''    def _connect(self) -> sqlite3.Connection:\n        conn = sqlite3.connect(self.database_path, timeout=5)\n        conn.row_factory = sqlite3.Row\n        return conn\n'''
              new = '''    @contextmanager\n    def _connect(self):\n        """Open a SQLite connection and always close it on context exit.\n\n        sqlite3.Connection.__exit__ commits/rolls back but does not close the\n        connection. Closing here is important on Windows, where SQLite WAL\n        files remain locked while the connection object is alive.\n        """\n        conn = sqlite3.connect(self.database_path, timeout=5)\n        conn.row_factory = sqlite3.Row\n        try:\n            yield conn\n        finally:\n            conn.close()\n'''
              if old not in text:
                  raise SystemExit(f"Expected _connect block not found in {path}")
              text = text.replace(old, new, 1)
              if text != original:
                  p.write_text(text, encoding="utf-8", newline="\n")

          patch_connect("src/memory.py")
          patch_connect("src/scheduler.py")

          p = Path("tests/test_routines_ui.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace("test_all_ten_presets_are_visible_in_scrollable_catalogue", "test_all_twelve_presets_are_visible_in_scrollable_catalogue")
          text = text.replace("self.assertEqual(len(self.dialog.rows), 10)", "self.assertEqual(len(self.dialog.rows), 12)")
          text = text.replace('"0 / 10"', '"0 / 12"')
          text = text.replace('"1 / 10"', '"1 / 12"')
          p.write_text(text, encoding="utf-8", newline="\n")

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "src/memory.py", "src/scheduler.py", "tests/test_routines_ui.py", ".github/workflows/repair_resources.yml"], check=True)
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode != 0:
              subprocess.run(["git", "rm", ".github/workflows/repair_resources.yml"], check=True)
              subprocess.run(["git", "add", "src/memory.py", "src/scheduler.py", "tests/test_routines_ui.py"], check=True)
              subprocess.run(["git", "commit", "-m", "fix: close SQLite connections after use"], check=True)
              subprocess.run(["git", "push"], check=True)
