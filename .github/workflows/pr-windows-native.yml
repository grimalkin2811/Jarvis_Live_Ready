name: Vérifications Windows natives (PR)

# Contrôles qui exigent un VRAI Windows (PR #50, validation du 2026-10-16) :
#
# * D01 — première ouverture du Dashboard sous Qt NATIF (plateforme
#   « windows », processus neufs), découpée en phases, puis réouvertures ;
#   mesures du protocole (dashboard_perf.py) sous Qt natif ;
# * B05 — build PyInstaller de validation (scripts/build_windows.ps1) :
#   versions Qt ATTENDUES (contrainte de requirements.txt, qt_versions.json),
#   EMBARQUÉES (Qt6Core.dll) et CHARGÉES (Jarvis.exe --qt-versions) comparées
#   strictement, puis test de fumée de l'exécutable.
#
# Le workflow de release (build.yml) n'est pas modifié. Ici : aucune release,
# aucun tag, aucun artefact publié, aucune donnée personnelle. Les runners
# GitHub ne sont pas le PC de validation (Pentium G5400) : les chiffres de D01
# sont un repère Windows natif, pas une validation du PC cible.

on:
  pull_request:
    branches: [main]
    paths:
      - "UI/dashboard/**"
      - "requirements.txt"
      - "requirements-lock/windows-py311.txt"
      - "packaging/**"
      - "scripts/build_windows.ps1"
      - "scripts/check_qt_runtime.py"
      - "scripts/dashboard_first_open_profile.py"
      - "scripts/dashboard_perf.py"
      - "src/qt_versions.py"
      - "src/main.py"
      - ".github/workflows/pr-windows-native.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"

jobs:
  dashboard:
    name: Dashboard — première ouverture (Qt natif)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock/windows-py311.txt
          python -m pip check

      - name: Profil de première ouverture (5 processus neufs, Qt natif)
        run: python scripts/dashboard_first_open_profile.py --natif --repetitions 5 --reouvertures 5 --json profil.json

      - name: Sonde des polices de symboles (couverture, coût du repli)
        run: python scripts/dashboard_first_open_profile.py --natif --sonde-polices --json sonde_polices.json

      - name: Mesures du protocole sous Qt natif (dashboard_perf.py)
        env:
          QT_QPA_PLATFORM: windows
        run: python scripts/dashboard_perf.py --out perf_natif

      # Synthèse en étapes SÉPARÉES : GitHub ne garde qu'environ 10 annotations
      # par type et par étape (au-delà, elles sont perdues silencieusement).
      - name: Synthèse — profil D01
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path

          profil = Path("profil.json")
          if not profil.exists():
              print("::warning title=D01 Windows natif::profil absent")
          else:
              data = json.loads(profil.read_text(encoding="utf-8"))
              synth = data.get("synthese", {})
              msg = (f"premiere ouverture mediane {synth.get('premiere_ouverture_mediane_ms')} ms "
                     f"(max {synth.get('premiere_ouverture_max_ms')}, seuil 1500) ; reouverture mediane "
                     f"{synth.get('reouverture_mediane_ms')} ms ; phases {synth.get('phases_medianes_ms', {})}")
              print(f"::notice title=D01 Windows natif::{msg}")
              for index, essai in enumerate(data.get("essais", []), 1):
                  contenu = essai.get("polices_chargees_pendant_le_contenu", [])
                  court = {"premiere_ouverture_ms": essai.get("premiere_ouverture_ms"),
                           "contenu_complet_ms": essai.get("contenu_complet_ms"),
                           "phases_ms": essai.get("phases_ms"),
                           "rebuild_pages_ms": essai.get("etapes_constructeur_ms", {}).get("rebuild_pages"),
                           "apply_stylesheet_ms": essai.get("etapes_constructeur_ms", {}).get("_apply_stylesheet"),
                           "fichiers_construction": len(essai.get("fichiers_charges_pendant_la_construction", [])),
                           "polices_contenu": len(contenu), "exemples_contenu": contenu[:4],
                           "reouvertures_ms": essai.get("reouvertures_ms"), "erreur": essai.get("erreur")}
                  print(f"::notice title=D01 processus {index}::{json.dumps(court, ensure_ascii=False)[:1200]}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(f"## Dashboard sous Qt natif (runner GitHub, pas le PC cible)\n\n* D01 : {msg}\n")

      # Le résumé d'étape n'est pas plafonné (contrairement aux annotations,
      # limitées à ~10 par étape) : toute la sonde y est écrite, et seuls
      # quelques points clés sont publiés en annotations.
      - name: Synthèse — sonde des polices
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path

          sonde = Path("sonde_polices.json")
          if not sonde.exists():
              print("::warning title=Sonde polices::sonde absente")
              raise SystemExit(0)
          data = json.loads(sonde.read_text(encoding="utf-8"))
          lignes = ["## Sonde des polices (Windows natif)", ""]
          for cle, valeur in data.items():
              lignes.append(f"### {cle}")
              lignes.append("")
              lignes.append("```json")
              lignes.append(json.dumps(valeur, ensure_ascii=False, indent=1)[:4000])
              lignes.append("```")
              lignes.append("")
          resume = os.environ.get("GITHUB_STEP_SUMMARY")
          if resume:
              with open(resume, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lignes) + "\n")
          couverture = data.get("couverture", {})
          if isinstance(couverture, dict) and "couverture" in couverture:
              print(f"::notice title=Sonde polices couverture::"
                    f"{json.dumps(couverture['couverture'], ensure_ascii=False)[:1200]}")
          couts = {k: v for k, v in data.items() if k.startswith("couts_glyphes") or k == "glyphes_couteux"}
          for cle, valeur in couts.items():
              print(f"::notice title=Sonde polices {cle}::{json.dumps(valeur, ensure_ascii=False)[:2500]}")
          etapes = data.get("attribution", {}).get("polices_par_etape")
          if etapes:
              print(f"::notice title=Sonde polices chargées par étape::{json.dumps(etapes, ensure_ascii=False)[:1200]}")

      - name: Synthèse — dashboard_perf (indicatif, runner)
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path

          perf = Path("perf_natif/perf.json")
          if not perf.exists():
              print("::warning title=dashboard_perf Windows natif::mesures absentes")
          else:
              data = json.loads(perf.read_text(encoding="utf-8"))
              checks = {k: (v.get("value"), v.get("limit"), v.get("ok")) for k, v in data.get("checks", {}).items()}
              ko = {k: v for k, v in checks.items() if not v[2]}
              msg = (f"plateforme {data.get('qpa')} ; criteres en echec {ko or 'aucun'} ; "
                     f"onepage premier affichage {data.get('onepage_build_ms')} ms ; contenu initial "
                     f"{data.get('window_first_content_ms')} ms ; latence max par phase "
                     f"{data.get('event_loop_max_lag_by_phase_ms')}")
              print(f"::notice title=dashboard_perf Windows natif::{msg}")
              print(f"::notice title=dashboard_perf criteres::{json.dumps(checks, ensure_ascii=False)[:1500]}")
              if ko:
                  # Visible sans bloquer : le runner n'est pas le PC cible (seuils du PC de validation).
                  print(f"::warning title=dashboard_perf Windows natif — criteres en echec::{json.dumps(ko, ensure_ascii=False)}")


      # Prémisses du correctif D01 vérifiées sur les polices RÉELLES de Windows :
      # un symbole laissé dans le texte doit être dans chaque police principale des
      # thèmes, tous les autres dans la police de symboles ; sinon Qt recharge les
      # polices du système au premier rendu. Échec du job (pas un avertissement).
      - name: Couverture des symboles du Dashboard (correctif D01)
        if: always()
        shell: python
        run: |
          import json, sys
          from pathlib import Path

          sonde = Path("sonde_polices.json")
          couverture = json.loads(sonde.read_text(encoding="utf-8")).get("couverture", {}) if sonde.exists() else {}
          echecs = []
          if "interface_non_couverts" not in couverture:
              echecs.append(f"sonde de couverture absente ou en erreur : {json.dumps(couverture, ensure_ascii=False)[:400]}")
          else:
              print(f"::notice title=Couverture des symboles (D01)::inventaire {couverture['inventaire']} ; "
                    f"surs dans le texte {couverture['symboles_surs_dans_le_texte']} ; polices principales "
                    f"{couverture['polices_principales']} ; police de symboles {couverture['police_symboles']}")
              if couverture["interface_non_couverts"]:
                  echecs.append("symboles laisses dans le texte absents d'une police principale : "
                                f"{json.dumps(couverture['interface_non_couverts'], ensure_ascii=False)}")
              if couverture["symboles_non_couverts"]:
                  echecs.append(f"symboles absents de la police de symboles {couverture['police_symboles']} : "
                                f"{couverture['symboles_non_couverts']}")
              # Coût de chaque glyphe (processus neufs) : au-delà de quelques fichiers,
              # le rendu balaie les polices du système (mesure native D01).
              couts = next((v for k, v in json.loads(sonde.read_text(encoding="utf-8")).items()
                            if k.startswith("couts_glyphes")), {})
              couteux = {g: c for g, c in couts.items() if c and c[0] and c[0] > 5}
              print(f"::notice title=Cout des glyphes (D01)::{json.dumps(couteux or 'aucun', ensure_ascii=False)}")
              if couteux:
                  echecs.append(f"glyphes dont le rendu charge les polices du système (texte, icone) : {couteux}")
          for echec in echecs:
              print(f"::error title=Couverture des symboles (D01)::{echec}")
          sys.exit(1 if echecs else 0)

  build:
    name: Build de validation — versions Qt et test de fumée
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Construire (scripts/build_windows.ps1, rien n'est publié)
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -DistDir dist
          if ($LASTEXITCODE -ne 0) { throw "Build Windows échoué" }

      - name: Versions Qt attendues, embarquées et chargées
        shell: pwsh
        run: |
          $expected = Get-Content "dist/qt_versions.json" -Raw | ConvertFrom-Json
          $dll = Get-ChildItem -Path "dist/app/_internal" -Recurse -Filter "Qt6Core.dll" | Select-Object -First 1
          if (-not $dll) { throw "Qt6Core.dll absent du build" }
          $embedded = $dll.VersionInfo.FileVersion
          $raw = & "dist/app/Jarvis.exe" --qt-versions
          $code = $LASTEXITCODE
          $loaded = ($raw | Where-Object { $_.Trim().StartsWith("{") } | Select-Object -Last 1) | ConvertFrom-Json
          $msg = "attendu PySide6 $($expected.pyside6) (contrainte $($expected.spec)) ; Qt6Core.dll embarque $embedded ; charge par Jarvis.exe : PySide6 $($loaded.pyside6), shiboken6 $($loaded.shiboken6), Qt $($loaded.qt_runtime), conforme=$($loaded.ok)"
          Write-Host "::notice title=B05 versions Qt du build::$msg"
          if ($code -ne 0 -or -not $loaded.ok) { throw "Versions chargées non conformes : $msg" }
          if (-not $embedded.StartsWith($expected.qt_runtime)) { throw "Qt6Core.dll ($embedded) différent de la version testée ($($expected.qt_runtime))" }
          if ($loaded.qt_runtime -ne $expected.qt_runtime -or $loaded.pyside6 -ne $expected.pyside6) { throw "Versions chargées différentes des versions vérifiées avant PyInstaller : $msg" }
          Write-Host "Versions Qt cohérentes : $msg" -ForegroundColor Green

      - name: Test de fumée de l'exécutable
        shell: pwsh
        run: |
          $exe = "dist/app/Jarvis.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru -NoNewWindow
          if (-not $process.WaitForExit(30000)) {
            try { $process.Kill() } catch { }
            throw "Jarvis.exe --smoke-test n'a pas terminé en 30 s"
          }
          Write-Host "::notice title=Test de fumee::Jarvis.exe --smoke-test code $($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "Test de fumée en échec (code $($process.ExitCode))" }
