name: Verify Release

# Vérification POST-PUBLICATION d'une release déjà publiée.
#
# La release v1.5.0 était verte de bout en bout alors que ses binaires ne
# contenaient ni les fonds d'items des menus, ni le solveur
# anti-chevauchement, ni le Writing Mode : aucun contrôle n'ouvrait le
# binaire produit. Ce workflow télécharge les artefacts RÉELLEMENT publiés,
# vérifie leurs empreintes, exécute le binaire, puis inspecte l'archive PYZ
# embarquée dans l'exécutable pour prouver que le code attendu s'y trouve.
#
# Chaque contrôle est une étape distincte : sa conclusion est lisible via
# l'API GitHub même lorsque les journaux bruts ne sont pas téléchargeables.
#
# Déclenchement manuel (tag au choix) ou automatique quand l'outillage de
# vérification change sur main — dans ce cas la dernière release publiée
# est re-certifiée.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à vérifier (défaut : dernière release)"
        required: false
        default: ""
      expected_version:
        description: "Version attendue dans le binaire (défaut : tag sans le v)"
        required: false
        default: ""
      expected_tools:
        description: "Nombre d'outils Gemini attendu (défaut : compté dans la source du tag)"
        required: false
        default: ""
      report_pr:
        description: "Numéro de PR où publier le rapport (0 = aucun)"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-release.yml"
      - "scripts/verify_release_bundle.py"

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    name: Vérification des artefacts publiés
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Paramètres de la vérification"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          VERSION="${{ inputs.expected_version }}"
          if [ -z "$VERSION" ]; then VERSION="${TAG#v}"; fi
          # Le nombre d'outils n'est PAS codé en dur : une valeur figée ici
          # devient fausse à la release suivante et fait échouer la
          # vérification d'une release pourtant conforme. Vide = il sera
          # compté dans la source du tag vérifié (étape suivante).
          TOOLS="${{ inputs.expected_tools }}"
          PR="${{ inputs.report_pr }}"
          if [ -z "$PR" ] || [ "$PR" = "0" ]; then
            # Déclenchement par push : on rattache le rapport à la PR qui a
            # amené le commit, pour qu'il reste lisible via l'API GitHub.
            PR=$(gh api "repos/$GH_REPO/commits/${{ github.sha }}/pulls" \
                   -q '.[0].number' 2>/dev/null || echo "")
            if [ -z "$PR" ] || [ "$PR" = "null" ]; then PR="0"; fi
          fi
          echo "TAG=$TAG"           | tee -a "$GITHUB_ENV"
          echo "VERSION=$VERSION"   | tee -a "$GITHUB_ENV"
          echo "TOOLS=$TOOLS"       | tee -a "$GITHUB_ENV"
          echo "REPORT_PR=$PR"      | tee -a "$GITHUB_ENV"

      # On se place sur le TAG vérifié : la liste d'outils attendue et le
      # script de contrôle doivent venir de la source exacte de la release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      # Le tag vérifié peut être antérieur à l'ajout du vérificateur : on
      # récupère l'outillage depuis la révision qui exécute ce workflow, tout
      # en gardant l'arbre source du tag (liste d'outils attendue, contrat).
      - uses: actions/checkout@v4
        with:
          path: _tooling

      - name: "Outillage de vérification"
        shell: bash
        run: |
          set -euo pipefail
          cp _tooling/scripts/verify_release_bundle.py scripts/verify_release_bundle.py
          echo "vérificateur issu de $(git -C _tooling rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Nombre d'outils attendu (source du tag)"
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TOOLS:-}" ]; then
            echo "nombre d'outils fourni en entrée : $TOOLS"
            exit 0
          fi
          COUNT=$(python - <<'PY'
          import ast, sys

          with open("src/tools.py", encoding="utf-8") as handle:
              tree = ast.parse(handle.read())
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and isinstance(node.value, ast.List):
                  for target in node.targets:
                      if getattr(target, "id", "") == "TOOL_DECLARATIONS":
                          print(len(node.value.elts))
                          sys.exit(0)
          sys.exit("TOOL_DECLARATIONS introuvable dans src/tools.py")
          PY
          )
          echo "outils déclarés dans la source du tag : $COUNT"
          echo "TOOLS=$COUNT" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: "Contrôle 0 — lignée Git du tag"
        run: python scripts/check_release_lineage.py --ref ${{ env.TAG }}

      - name: "Contrôle 1 — télécharger les artefacts publiés"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p relcheck
          gh release download "$TAG" --dir relcheck --clobber
          ls -l relcheck

      - name: "Contrôle 2 — provenance de la release (tag, commit, état)"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --json tagName,isDraft,isPrerelease,targetCommitish,publishedAt,assets \
            > release.json
          python - <<'PY'
          import json, os, subprocess, sys
          data = json.load(open("release.json", encoding="utf-8"))
          tag = data["tagName"]
          commit = subprocess.check_output(
              ["git", "rev-parse", f"{tag}^{{commit}}"], text=True).strip()
          print(f"tag            : {tag}")
          print(f"commit         : {commit}")
          print(f"draft          : {data['isDraft']}")
          print(f"prerelease     : {data['isPrerelease']}")
          print(f"publié le      : {data['publishedAt']}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"RELEASE_COMMIT={commit}\n")
              env.write(f"RELEASE_PUBLISHED={data['publishedAt']}\n")
          problems = []
          if data["isDraft"]:
              problems.append("la release est en brouillon")
          if data["isPrerelease"]:
              problems.append("la release est marquée pre-release")
          if len(data["assets"]) < 3:
              problems.append(f"{len(data['assets'])} artefact(s) au lieu de 3")
          if problems:
              print("PROBLEMES : " + " | ".join(problems))
              sys.exit(1)
          print("provenance OK")
          PY

      - name: "Contrôle 3 — SHA-256 des artefacts vs fichier .sha256"
        shell: bash
        run: |
          set -euo pipefail
          cd relcheck
          python - <<'PY'
          import glob, hashlib, os, sys

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          lines, problems = [], []
          for path in sorted(glob.glob("*")):
              if path.endswith(".sha256"):
                  continue
              digest = sha256(path)
              size = os.path.getsize(path)
              lines.append(f"| `{path}` | {size} | `{digest}` |")
              print(f"{path}\n  taille  : {size}\n  sha256  : {digest}")
              side = path + ".sha256"
              if os.path.isfile(side):
                  with open(side, encoding="utf-8-sig") as handle:
                      published = handle.read().split()[0].strip().lower()
                  if published != digest:
                      problems.append(
                          f"{path} : .sha256 publié={published} calculé={digest}")
                  else:
                      print("  .sha256 publié : IDENTIQUE OK")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("ARTIFACT_TABLE<<TABLE_EOF\n" + "\n".join(lines) + "\nTABLE_EOF\n")
          if problems:
              print("PROBLEMES : " + " | ".join(problems))
              sys.exit(1)
          PY

      - name: "Contrôle 4 — extraire le portable et lire version.json"
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls relcheck/*portable*.zip)
          mkdir -p extracted
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('extracted')" "$zip"
          python - <<'PY'
          import glob, json, os, sys
          expected = os.environ["VERSION"]
          hits = glob.glob("extracted/**/version.json", recursive=True)
          if not hits:
              print("version.json introuvable dans le ZIP")
              sys.exit(1)
          with open(hits[0], encoding="utf-8-sig") as handle:
              found = json.load(handle).get("version")
          print(f"{hits[0]} -> version {found} (attendu {expected})")
          sys.exit(0 if str(found) == expected else 1)
          PY

      - name: "Contrôle 5 — le binaire publié annonce la bonne version"
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find extracted -name Jarvis.exe | head -n 1)
          echo "exécutable : $exe"
          "$exe" --smoke-test | tee smoke.txt
          grep -q "Version: $VERSION" smoke.txt

      - name: "Contrôle 6 — contenu réel du binaire (PYZ : menus, Writing, Deezer, outils)"
        shell: bash
        run: |
          set -euo pipefail
          exe=$(find extracted -name Jarvis.exe | head -n 1)
          python scripts/verify_release_bundle.py \
            --bundle "$(dirname "$exe")" \
            --version "$VERSION" \
            --expect-tools "$TOOLS" | tee bundle.txt

      - name: "Contrôle 7 — l'installeur publié porte la bonne version"
        shell: bash
        run: |
          set -euo pipefail
          setup=$(ls relcheck/JarvisSetup-*.exe)
          echo "installeur : $setup"
          case "$setup" in
            *"$VERSION"*) echo "nom de fichier cohérent OK" ;;
            *) echo "nom de fichier incohérent"; exit 1 ;;
          esac

      - name: "Rapport"
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "## Vérification de la release ${TAG:-?}"
            echo
            echo "- commit : \`${RELEASE_COMMIT:-?}\`"
            echo "- publiée le : ${RELEASE_PUBLISHED:-?}"
            echo
            echo "| Artefact | Taille (octets) | SHA-256 |"
            echo "|---|---:|---|"
            echo "${ARTIFACT_TABLE:-| (indisponible) | | |}"
            echo
            echo "### Version annoncée par le binaire publié"
            echo '```'
            grep -E "^(Version|Frozen):" smoke.txt 2>/dev/null || echo "(non exécuté)"
            echo '```'
            echo "### Contenu réel du binaire"
            echo '```'
            cat bundle.txt 2>/dev/null || echo "(non exécuté)"
            echo '```'
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${REPORT_PR:-0}" != "0" ]; then
            gh pr comment "$REPORT_PR" --body-file report.md || true
          fi
