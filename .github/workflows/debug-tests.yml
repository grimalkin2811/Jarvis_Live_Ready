# TEMPORAIRE — diagnostic : 1 job par fichier du groupe wake-word.
# À SUPPRIMER une fois le fichier fautif identifié.
name: Debug tests (TEMPORAIRE)

"on":
  push:
    branches: ["arena/01a09228-jarvis-live-ready"]
    paths: [".github/workflows/debug-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  per-file:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - tests.test_wakeword
          - tests.test_wakeword_e2e
          - tests.test_download_models
          - tests.test_interruption
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter ${{ matrix.module }}
        run: python -m unittest -v ${{ matrix.module }}
        env:
          PYTHONUTF8: "1"
