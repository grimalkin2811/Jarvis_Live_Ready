# TEMPORAIRE — diagnostic : 1 job par classe de tests.test_wakeword + artefacts.
# À SUPPRIMER une fois le test fautif identifié.
name: Debug tests (TEMPORAIRE)

"on":
  push:
    branches: ["arena/01a09228-jarvis-live-ready"]
    paths: [".github/workflows/debug-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  per-class:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cls:
          - DownloadAllowedTests
          - CandidateDirsTests
          - ResolutionTests
          - DetectScoreKeyTests
          - CreateModelTests
          - AudioIOIntegrationTests
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter ${{ matrix.cls }}
        run: python -m unittest -v tests.test_wakeword.${{ matrix.cls }} *> out-${{ matrix.cls }}.txt; echo "EXIT=$LASTEXITCODE"; exit $LASTEXITCODE
        env:
          PYTHONUTF8: "1"

      - name: Téléverser la sortie
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.cls }}
          path: out-${{ matrix.cls }}.txt
          retention-days: 2
