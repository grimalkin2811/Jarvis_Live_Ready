name: Validate Gemini Live (reel)

# Validation FINALE du contexte conversationnel sur l'API Gemini Live reelle.
# Declenchee manuellement (workflow_dispatch) : la cle vient du secret
# GEMINI_API_KEY — jamais d'entree CLI, jamais affichee (le harness masque de
# toute facon tout motif AIza.../AQ.... dans ses sorties).
#
# Les tests du faux serveur (CI habituelle) ne sont PAS equivalents a ce run :
# celui-ci exécute le vrai pipeline vocal (audio reel, VAD serveur,
# reconnexions, outils) contre l'API reelle.

# Declenchement : chaque push sur la branche de la PR (le jeton de ce
# sandbox ne peut pas utiliser workflow_dispatch), + manuel pour plus tard.
# APRES la phase de validation, retirer le trigger pull_request pour ne pas
# consommer de quota API a chaque push.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: "Modele Live a tester"
        required: false
        default: "gemini-2.5-flash-native-audio-preview-12-2025"
      mode:
        description: "auto (TTS puis Live), tts, live-tts ou text"
        required: false
        default: "auto"

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: "1"

jobs:
  validate:
    name: Validation reelle (audio, reconnexions, outils)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependances
        run: pip install google-genai numpy

      # Le jeton de ce depot ne peut pas dispatcher le workflow ni lire les
      # logs depuis le sandbox : le bilan est donc PUBLIE en commentaire de
      # la PR (lisible via l'API github.com).
      - name: Validation Gemini Live reelle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python scripts/validate_real_gemini.py \
            --model "${{ inputs.model || 'gemini-2.5-flash-native-audio-preview-12-2025' }}" \
            --mode "${{ inputs.mode || 'auto' }}" \
            --record reponses 2>&1 | tee validation.log
        continue-on-error: true

      - name: Bilan en commentaire de PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          VERDICT=$(awk '/^={60}$/{flag=1} flag' validation.log | head -80)
          if [ -z "$VERDICT" ]; then
            VERDICT="(bloc de verdict introuvable — voir le log complet du run)"
          fi
          # Anti-doublon : si le dernier commentaire auto-posté porte deja
          # exactement le meme verdict, on ne reposte pas (chaque push
          # declenche ce workflow ; la PR resterait sinon polluee).
          VERDICT_LINES=$(printf '%s\n' "$VERDICT" | grep -E '^(GEMINI|AUDIO|RECONNEXION|SESSION|OUTILS) ' || true)
          LAST=$(gh pr view "$PR_NUMBER" --json comments \
            --jq '[.comments[] | select(.author.login == "github-actions")][-1].body' 2>/dev/null || true)
          LAST_LINES=$(printf '%s\n' "$LAST" | grep -E '^(GEMINI|AUDIO|RECONNEXION|SESSION|OUTILS) ' || true)
          if [ -n "$VERDICT_LINES" ] && [ "$VERDICT_LINES" = "$LAST_LINES" ]; then
            echo "Verdict identique au dernier commentaire auto-poste : pas de doublon."
            exit 0
          fi
          {
            echo "## Validation Gemini Live réelle — run ${GITHUB_RUN_ID}"
            echo ''
            echo '```'
            echo "$VERDICT"
            echo '```'
            echo ''
            echo '*Auto-posté par le workflow Validate Gemini Live (reel). Artefact* `reponses-audio` *: les réponses vocales à écouter.*'
          } | gh pr comment "$PR_NUMBER" --body-file -

      - name: Reponses audio (a ecouter)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reponses-audio
          path: reponses/
          if-no-files-found: ignore

      - name: Conclusion
        if: always()
        run: |
          if [ ! -f validation.log ]; then echo "pas de log"; exit 1; fi
          if grep -q ' : FAIL' validation.log; then
            echo 'VALIDATION EN ECHEC (voir le commentaire de PR)'; exit 1
          fi
          echo 'Aucun FAIL — voir les verdicts dans le commentaire de PR.'

